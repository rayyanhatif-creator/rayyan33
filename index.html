<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحكم العز الذكي</title>
    <style>
        :root { --gold: #c5a059; --dark: #0a0a0a; }
        body { background: var(--dark); color: white; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        
        .lamp-preview {
            width: 150px; height: 150px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--gold) 0%, transparent 70%);
            box-shadow: 0 0 50px var(--gold);
            margin-bottom: 50px;
            transition: 0.5s;
        }

        .controls { background: #111; padding: 30px; border-radius: 30px; border: 1px solid #222; width: 80%; max-width: 300px; text-align: center; }
        
        input[type="range"] { width: 100%; appearance: none; background: #222; height: 10px; border-radius: 5px; outline: none; margin: 20px 0; }
        input[type="range"]::-webkit-slider-thumb { appearance: none; width: 20px; height: 20px; background: var(--gold); border-radius: 50%; cursor: pointer; }

        .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        .mode-btn { background: #000; border: 1px solid #333; color: #666; padding: 10px; border-radius: 10px; cursor: pointer; font-size: 0.8rem; }
        .mode-btn.active { border-color: var(--gold); color: var(--gold); }

        footer { position: absolute; bottom: 30px; color: #333; font-size: 0.7rem; letter-spacing: 2px; }
    </style>
</head>
<body>

    <div class="lamp-preview" id="preview"></div>

    <div class="controls">
        <label>قوة الإضاءة</label>
        <input type="range" min="0" max="100" value="50" oninput="updateBrightness(this.value)">
        
        <label>اختيار المود</label>
        <div class="modes">
            <button class="mode-btn active" onclick="setMode('Steady')">هادئ</button>
            <button class="mode-btn" onclick="setMode('Focus')">تركيز</button>
            <button class="mode-btn" onclick="setMode('Pulse')">نبض</button>
            <button class="mode-btn" onclick="setMode('Alert')">تنبيه</button>
        </div>
    </div>

    <footer>AL-EZZ SMART HOME SOLUTIONS</footer>

    <script>
        function updateBrightness(val) {
            document.getElementById('preview').style.opacity = val / 100;
            document.getElementById('preview').style.boxShadow = `0 0 ${val/2}px var(--gold)`;
        }

        function setMode(mode) {
            // هنا مستقبلاً ترسل الأمر للقطعة عبر الواي فاي
            console.log("Current Mode: " + mode);
            const btns = document.querySelectorAll('.mode-btn');
            btns.forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
        }
    </script>
</body>
</html>
