<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فعاليات الكافية | حجز</title>
    <style>
        body { background-color: #0f0f0f; color: #fff; font-family: sans-serif; display: flex; justify-content: center; padding: 20px; }
        .event-card {
            background: #1a1a1a;
            border-left: 4px solid #c5a059;
            padding: 20px;
            border-radius: 8px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .status { color: #c5a059; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; }
        h2 { margin: 10px 0; font-weight: 300; }
        .details { color: #888; font-size: 0.9rem; margin-bottom: 20px; }
        .book-btn {
            background: #c5a059;
            color: #000;
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
        }
        .book-btn:hover { background: #e2ba73; }
    </style>
</head>
<body>

    <div class="event-card">
        <span class="status">قريباً - May 15</span>
        <h2>بطولة بلوت العز</h2>
        <p class="details">انضم إلينا في ليلة حماسية.. المقاعد محدودة جداً.</p>
        <div style="margin-bottom: 15px;">
            <span>السعر: 50 ريال</span>
        </div>
        <button class="book-btn">احجز مقعدك الآن</button>
    </div>

</body>
</html>
