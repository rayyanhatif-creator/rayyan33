<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مساعد العز الذكي | AI</title>
    <style>
        :root { --gold: #c5a059; --dark: #050505; }
        body { background: var(--dark); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }

        /* تأثير الكرة المتفاعلة */
        .ai-orb {
            width: 200px; height: 200px;
            background: radial-gradient(circle, var(--gold) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(30px);
            opacity: 0.5;
            animation: breathe 4s infinite ease-in-out;
            position: absolute; z-index: 0;
        }

        @keyframes breathe {
            0%, 100% { transform: scale(1); opacity: 0.3; }
            50% { transform: scale(1.5); opacity: 0.6; }
        }

        .content { position: relative; z-index: 1; text-align: center; width: 80%; max-width: 600px; }
        h1 { font-weight: 200; letter-spacing: 10px; font-size: 2.5rem; margin-bottom: 50px; }
        
        .chat-container { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(197, 160, 89, 0.2); border-radius: 20px; padding: 20px; backdrop-filter: blur(10px); }
        .ai-response { color: var(--gold); font-size: 1.1rem; margin-bottom: 20px; min-height: 50px; line-height: 1.6; }
        
        .input-area { display: flex; gap: 10px; background: #000; padding: 5px; border-radius: 12px; border: 1px solid #222; }
        input { flex: 1; background: transparent; border: none; color: white; padding: 15px; outline: none; }
        button { background: var(--gold); border: none; padding: 0 25px; border-radius: 10px; cursor: pointer; font-weight: bold; }

        .footer { position: absolute; bottom: 30px; font-size: 0.7rem; color: #333; letter-spacing: 3px; }
    </style>
</head>
<body>

    <div class="ai-orb"></div>

    <div class="content">
        <h1>AL-EZZ AI</h1>
        
        <div class="chat-container">
            <div id="response" class="ai-response">أهلاً بك.. أنا مساعدك الذكي من عائلة العز، كيف يمكنني خدمتك اليوم؟</div>
            <div class="input-area">
                <input type="text" id="userInput" placeholder="اسألني أي شيء...">
                <button onclick="askAI()">إرسال</button>
            </div>
        </div>
    </div>

    <div class="footer">FUTURE OF INTERACTION &copy; 2026</div>

    <script>
        function askAI() {
            const input = document.getElementById('userInput').value;
            const responseDiv = document.getElementById('response');
            
            if(!input) return;

            responseDiv.innerText = "جاري التفكير...";
            
            // محاكاة لرد الذكاء الاصطناعي بأسلوب فخم
            setTimeout(() => {
                responseDiv.innerText = "بصفتي ذكاءً اصطناعياً مخصصاً لعائلة العز، قمت بتحليل طلبك المتعلق بـ '" + input + "'. نحن نعمل دائماً على تقديم حلول تتجاوز التوقعات.";
                document.getElementById('userInput').value = "";
            }, 1500);
        }
    </script>
</body>
</html>
