<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اسم الكافية | القائمة الرقمية</title>
    <style>
        :root {
            --primary-gold: #c5a059;
            --dark-bg: #0a0a0a;
            --card-bg: #141414;
            --text-white: #ffffff;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--text-white);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 400px;
            text-align: center;
            padding: 40px 0;
        }

        .logo {
            width: 100px;
            height: 100px;
            background: var(--primary-gold);
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 24px;
            box-shadow: 0 0 20px rgba(197, 160, 89, 0.2);
        }

        h1 {
            font-size: 1.5rem;
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        p {
            color: #888;
            font-size: 0.9rem;
            margin-bottom: 30px;
        }

        .links-wrapper {
            display: grid;
            gap: 15px;
        }

        .link-card {
            background: var(--card-bg);
            border: 1px solid #222;
            padding: 18px;
            border-radius: 12px;
            text-decoration: none;
            color: var(--text-white);
            font-weight: 500;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .link-card:hover {
            border-color: var(--primary-gold);
            transform: translateY(-3px);
            background: #1a1a1a;
        }

        .main-btn {
            background: var(--primary-gold);
            color: black;
            font-weight: bold;
        }

        .footer {
            margin-top: 50px;
            font-size: 0.8rem;
            color: #555;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo">LOGO</div>
        
        <h1>اسم الكافية</h1>
        <p>القهوة المختصة والحلى الفاخر</p>

        <div class="links-wrapper">
            <a href="#" class="link-card main-btn">تصفح المنيو الرقمي</a>
            
            <a href="#" class="link-card">موقعنا على Google Maps</a>
            <a href="#" class="link-card">حسابنا في إنستقرام</a>
            <a href="#" class="link-card">رأيك يهمنا (تقييم الخدمة)</a>
            <a href="#" class="link-card">تواصل معنا واتساب</a>
        </div>

        <div class="footer">
            جميع الحقوق محفوظة لعائلة العز
        </div>
    </div>

</body>
</html>
