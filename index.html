<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AL-EZZ PUSH | منصة الإطلاق الفخمة</title>
    <style>
        :root { --gold: #c5a059; --bg: #030303; --card: #101010; --border: #222; }
        body { background: var(--bg); color: white; font-family: 'Inter', 'Segoe UI', sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* Sidebar */
        .sidebar { width: 100px; background: #000; border-left: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; padding: 30px 0; }
        .logo-icon { color: var(--gold); font-size: 1.5rem; font-weight: bold; margin-bottom: 50px; }
        .tool-icon { width: 50px; height: 50px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 20px; display: flex; align-items: center; justify-content: center; cursor: grab; color: #444; transition: 0.3s; }
        .tool-icon:hover { border-color: var(--gold); color: var(--gold); transform: scale(1.05); }

        /* Main Canvas */
        .canvas { flex: 1; padding: 40px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
        .canvas-header { position: absolute; top: 40px; right: 40px; color: var(--gold); letter-spacing: 2px; font-size: 0.8rem; }

        /* Offer Preview (The Centerpiece) */
        .offer-preview { 
            width: 300px; height: 400px; background: var(--card); border-radius: 25px; 
            border: 2px solid #222; box-shadow: 0 40px 100px rgba(0,0,0,0.7); 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: 0.5s; position: relative; overflow: hidden;
        }
        .offer-preview.active { border-color: var(--gold); }
        .offer-preview .placeholder { color: #222; font-size: 5rem; }

        /* Discount Text */
        .discount-text { font-size: 3.5rem; color: var(--gold); font-weight: 200; margin: 0; display: none; }
        .item-icon-preview { font-size: 4rem; margin-bottom: 20px; display: none; }

        /* Launch Button */
        .launch-btn { 
            position: absolute; bottom: 50px; background: var(--gold); color: black; 
            border: none; padding: 20px 60px; border-radius: 50px; font-weight: bold; 
            font-size: 1.1rem; cursor: pointer; transition: 0.3s;
            box-shadow: 0 15px 30px rgba(197, 160, 89, 0.2);
            opacity: 0.5; pointer-events: none;
        }
        .launch-btn.ready { opacity: 1; pointer-events: all; }
        .launch-btn:hover { transform: translateY(-3px); box-shadow: 0 20px 40px rgba(197, 160, 89, 0.3); }

    </style>
</head>
<body>

    <div class="sidebar">
        <div class="logo-icon">E</div>
        <div class="tool-icon" draggable="true" ondragstart="drag(event)" id="coffee">☕</div>
        <div class="tool-icon" draggable="true" ondragstart="drag(event)" id="cake">🍰</div>
        <div class="tool-icon" draggable="true" ondragstart="drag(event)" id="percent">50%</div>
    </div>

    <div class="canvas" ondrop="drop(event)" ondragover="allowDrop(event)">
        <div class="canvas-header">لوحة التحكم اللحظية | العز</div>
        
        <div class="offer-preview" id="previewArea">
            <div class="placeholder">⚡</div>
            <div class="item-icon-preview" id="itemIcon">☕</div>
            <h1 class="discount-text" id="discountVal">خصم 50%</h1>
            <div style="color: #666; font-size: 0.9rem; margin-top: 10px; display: none;" id="timerDesc">العرض ينتهي خلال: 30:00</div>
        </div>

        <button class="launch-btn" id="launchBtn">إطلاق العرض الآن ✨</button>
    </div>

    <script>
        function allowDrop(ev) { ev.preventDefault(); }
        function drag(ev) { ev.dataTransfer.setData("text", ev.target.id); }

        function drop(ev) {
            ev.preventDefault();
            var data = ev.dataTransfer.getData("text");
            var preview = document.getElementById('previewArea');
            var placeholder = preview.querySelector('.placeholder');
            
            preview.classList.add('active');
            placeholder.style.display = 'none';

            if (data === 'coffee') {
                document.getElementById('itemIcon').style.display = 'block';
                document.getElementById('itemIcon').innerText = '☕';
            } else if (data === 'percent') {
                document.getElementById('discountVal').style.display = 'block';
                document.getElementById('timerDesc').style.display = 'block';
                document.getElementById('launchBtn').classList.add('ready');
            }
        }
    </script>

</body>
</html>
