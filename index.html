<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streamer Overlay | Al-Ezz</title>
    <style>
        :root { --gold: #c5a059; --bg: transparent; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; overflow: hidden; }
        
        /* شريط الهدف الفخم */
        .goal-container {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 500px;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #222;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .goal-header { font-size: 0.8rem; letter-spacing: 3px; color: var(--gold); margin-bottom: 10px; }
        
        .progress-track {
            width: 100%;
            height: 8px;
            background: #111;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #333;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #8b6b3d, var(--gold));
            width: 65%; /* يتم التحكم بها برمجياً */
            box-shadow: 0 0 15px rgba(197, 160, 89, 0.5);
            transition: 1s ease-out;
        }

        .goal-stats { display: flex; justify-content: space-between; margin-top: 10px; font-size: 0.9rem; }

        /* تنبيه الدعم (يظهر ويختفي بأنيميشن) */
        .donation-alert {
            position: absolute;
            top: 50px;
            right: 50px;
            background: linear-gradient(135deg, #111, #000);
            border-right: 4px solid var(--gold);
            padding: 20px 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 20px;
            animation: slideIn 0.8s forwards;
        }

        @keyframes slideIn {
            from { transform: translateX(120%); }
            to { transform: translateX(0); }
        }

        .brand-footer { position: absolute; bottom: 10px; right: 20px; font-size: 0.6rem; color: rgba(255,255,255,0.2); }
    </style>
</head>
<body>

    <div class="donation-alert">
        <div style="font-size: 2rem;">✨</div>
        <div>
            <div style="color: var(--gold); font-size: 0.7rem; letter-spacing: 2px;">NEW DONATION</div>
            <div style="font-size: 1.2rem; font-weight: bold;">Rayyan - $50.00</div>
        </div>
    </div>

    <div class="goal-container">
        <div class="goal-header">NEW PC SETUP GOAL</div>
        <div class="progress-track">
            <div class="progress-fill"></div>
        </div>
        <div class="goal-stats">
            <span>$650.00</span>
            <span style="color: #444;">$1000.00</span>
        </div>
    </div>

    <div class="brand-footer">DESIGNED BY AL-EZZ</div>

</body>
</html>
