<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | العروض الفورية</title>
    <style>
        :root { --gold: #c5a059; --bg: #0d0d0d; --card: #1a1a1a; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; }
        
        .admin-panel { max-width: 600px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
        .header h1 { font-weight: 300; font-size: 1.2rem; letter-spacing: 2px; color: var(--gold); }

        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 30px; }
        .stat-card { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid #222; text-align: center; }
        .stat-card span { display: block; font-size: 0.8rem; color: #666; margin-bottom: 10px; }
        .stat-card p { font-size: 1.5rem; margin: 0; color: var(--gold); }

        .action-area { background: var(--card); padding: 30px; border-radius: 20px; border: 1px solid #222; }
        .label { display: block; margin-bottom: 10px; font-size: 0.9rem; color: #888; }
        
        select, input { 
            width: 100%; padding: 15px; background: #222; border: 1px solid #333; 
            border-radius: 10px; color: white; margin-bottom: 20px; font-size: 1rem;
        }

        .btn-blast { 
            background: var(--gold); color: black; border: none; padding: 20px; 
            border-radius: 12px; font-weight: bold; width: 100%; cursor: pointer;
            font-size: 1.1rem; box-shadow: 0 10px 20px rgba(197, 160, 89, 0.2);
        }

        footer { text-align: center; margin-top: 40px; font-size: 0.7rem; color: #444; }
    </style>
</head>
<body>

    <div class="admin-panel">
        <div class="header">
            <h1>AL-EZZ FLASH SALES</h1>
            <div style="background: green; width: 10px; height: 10px; border-radius: 50%;"></div>
        </div>

        <div class="stat-grid">
            <div class="stat-card"><span>مبيعات اليوم</span><p>1,250 ر.س</p></div>
            <div class="stat-card"><span>نشاط العروض</span><p>نشط الآن</p></div>
        </div>

        <div class="action-area">
            <span class="label">اختر نوع العرض الفوري</span>
            <select>
                <option>خصم 30% لمدة ساعة</option>
                <option>اشتري واحد واحصل على الثاني مجاناً</option>
                <option>كوبون "الساعة السعيدة" - 50%</option>
            </select>

            <span class="label">الرسالة الموجهة للزبائن</span>
            <input type="text" value="الحق العرض! خصم 30% في فرعنا الآن وحتى الساعة 6 مساءً">

            <button class="btn-blast">إطلاق العرض الآن 🚀</button>
        </div>

        <footer>جميع الحقوق محفوظة لعائلة العز &copy; 2026</footer>
    </div>

</body>
</html>
