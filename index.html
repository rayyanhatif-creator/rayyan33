<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام الانتظار الذكي</title>
    <style>
        :root { --gold: #c5a059; --bg: #050505; --card: #111111; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        
        .queue-card {
            background: var(--card);
            width: 90%;
            max-width: 400px;
            padding: 40px;
            border-radius: 25px;
            text-align: center;
            border: 1px solid #222;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .current-number {
            font-size: 5rem;
            color: var(--gold);
            margin: 20px 0;
            font-weight: 200;
        }

        .info-text { color: #666; font-size: 0.9rem; margin-bottom: 30px; }

        .input-group { margin-bottom: 20px; text-align: right; }
        input {
            width: 100%;
            padding: 15px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 10px;
            color: white;
            box-sizing: border-box;
        }

        .btn-gold {
            background: var(--gold);
            color: black;
            border: none;
            padding: 18px 40px;
            border-radius: 12px;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-gold:hover { transform: scale(1.02); opacity: 0.9; }

        footer { margin-top: 30px; font-size: 0.7rem; color: #333; }
    </style>
</head>
<body>

    <div class="queue-card">
        <div style="color: var(--gold); font-weight: bold; letter-spacing: 2px;">LUXURY SERVICE</div>
        <p class="info-text">مرحباً بك، يرجى تسجيل دخولك للانضمام إلى قائمة الانتظار الرقمية</p>
        
        <div class="current-number">08</div>
        <p style="margin-top: -10px; color: #444;">الرقم الحالي قيد الخدمة</p>

        <div class="input-group">
            <input type="text" placeholder="الاسم الكريم">
        </div>
        <div class="input-group">
            <input type="tel" placeholder="رقم الجوال">
        </div>

        <button class="btn-gold">احجز رقمك الآن</button>

        <footer>
            جميع الحقوق محفوظة لعائلة العز &copy; 2026
        </footer>
    </div>

</body>
</html>
