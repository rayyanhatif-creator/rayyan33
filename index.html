<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Al-Ezz Tech-Art</title>
    <style>
        body { background: #000; color: #c5a059; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; text-align: center; }
        
        /* أنيميشن الدائرة السحرية */
        .glow-circle {
            width: 150px; height: 150px;
            border: 2px solid #c5a059; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 30px rgba(197, 160, 89, 0.4);
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.1); opacity: 1; box-shadow: 0 0 50px rgba(197, 160, 89, 0.6); }
            100% { transform: scale(1); opacity: 0.8; }
        }

        h1 { font-weight: 200; margin-top: 30px; letter-spacing: 5px; }
        p { color: #555; font-size: 0.8rem; }
    </style>
</head>
<body>
    <div class="glow-circle">
        <span style="font-size: 3rem;">✨</span>
    </div>
    <h1>AL-EZZ EXPERIENCE</h1>
    <p>شكراً لزيارتك.. نحن نبني المستقبل بلمسة فنية</p>
</body>
</html>
