<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الخدمات الاحترافية</title>
    <style>
        :root { --gold: #c5a059; --dark: #0a0a0a; --card: #161616; --text: #ffffff; }
        body { background: var(--dark); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; }
        
        /* Navigation */
        nav { padding: 25px 5%; display: flex; justify-content: space-between; border-bottom: 1px solid #222; }
        .logo { font-weight: bold; color: var(--gold); font-size: 1.2rem; }

        /* Hero */
        .hero { padding: 60px 5%; text-align: center; background: linear-gradient(to bottom, #111, var(--dark)); }
        .hero h1 { font-size: 2.5rem; font-weight: 300; margin-bottom: 15px; }
        .hero p { color: #888; max-width: 600px; margin: 0 auto 30px; }

        /* Services Grid */
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; padding: 0 5% 50px; }
        .service-card { 
            background: var(--card); 
            padding: 30px; 
            border-radius: 15px; 
            border: 1px solid #222; 
            transition: 0.3s;
            text-align: center;
        }
        .service-card:hover { border-color: var(--gold); transform: translateY(-5px); }
        .service-card h3 { color: var(--gold); margin-bottom: 15px; }
        .price { font-size: 1.4rem; display: block; margin-bottom: 20px; font-weight: bold; }

        /* Booking Form */
        .booking-section { background: #111; padding: 60px 5%; border-radius: 30px 30px 0 0; }
        .form-group { max-width: 500px; margin: 0 auto; display: grid; gap: 15px; }
        input, select { 
            background: #1a1a1a; border: 1px solid #333; padding: 15px; 
            color: white; border-radius: 8px; font-size: 1rem;
        }
        .btn-main { 
            background: var(--gold); color: black; border: none; padding: 18px; 
            border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1.1rem;
        }
        
        footer { text-align: center; padding: 40px; color: #444; font-size: 0.8rem; }
    </style>
</head>
<body>

    <nav>
        <div class="logo">LUXURY CENTER</div>
        <div class="menu">القائمة</div>
    </nav>

    <section class="hero">
        <h1>ارتقِ بتجربتك اليوم</h1>
        <p>نقدم لك أفضل الخدمات باحترافية عالية وبيئة صممت لراحتك.</p>
    </section>

    <div class="grid">
        <div class="service-card">
            <h3>الخدمة الأساسية</h3>
            <p style="color: #666; font-size: 0.9rem;">وصف بسيط للخدمة وما يميزها عن غيرها.</p>
            <span class="price">250 ريال</span>
            <button onclick="document.getElementById('booking').scrollIntoView()" class="btn-main" style="padding: 10px 20px; font-size: 0.9rem;">اختيار</button>
        </div>
        </div>

    <section id="booking" class="booking-section">
        <div class="form-group">
            <h2 style="text-align: center; color: var(--gold);">حجز موعد جديد</h2>
            <input type="text" placeholder="الاسم الكامل">
            <input type="tel" placeholder="رقم الجوال">
            <select>
                <option>اختر الخدمة</option>
                <option>الخدمة الأولى</option>
                <option>الخدمة الثانية</option>
            </select>
            <input type="date">
            <button class="btn-main">تأكيد الحجز</button>
        </div>
    </section>

    <footer>
        جميع الحقوق محفوظة لعائلة العز &copy; 2026
    </footer>

</body>
</html>
