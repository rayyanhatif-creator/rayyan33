<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة العز للاستثمار العقاري</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --gold: #c5a059; --bg: #050505; --card: #111; --border: #222; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; }
        
        .main-container { max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
        .config-box { background: var(--card); padding: 30px; border-radius: 25px; border: 1px solid var(--border); }
        .result-box { background: #000; padding: 30px; border-radius: 25px; border: 1px solid var(--gold); display: flex; flex-direction: column; align-items: center; }

        h2 { color: var(--gold); font-weight: 300; margin-bottom: 30px; border-right: 3px solid var(--gold); padding-right: 15px; }
        
        .form-group { margin-bottom: 20px; }
        label { display: block; color: #888; font-size: 0.9rem; margin-bottom: 8px; }
        input { width: 100%; padding: 15px; background: #1a1a1a; border: 1px solid #333; color: white; border-radius: 12px; outline: none; transition: 0.3s; }
        input:focus { border-color: var(--gold); }

        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; width: 100%; margin-top: 20px; }
        .stat-card { background: #111; padding: 15px; border-radius: 15px; text-align: center; border: 1px solid #222; }
        .stat-val { display: block; font-size: 1.2rem; color: var(--gold); font-weight: bold; }
        
        canvas { max-width: 300px; margin: 20px 0; }
        footer { grid-column: span 2; text-align: center; color: #333; font-size: 0.8rem; margin-top: 40px; }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="config-box">
            <h2>محلل العقار الذكي</h2>
            <div class="form-group">
                <label>سعر العقار (ريال)</label>
                <input type="number" id="price" value="1000000" oninput="calculate()">
            </div>
            <div class="form-group">
                <label>قيمة الإيجار المتوقعة سنوياً</label>
                <input type="number" id="rent" value="50000" oninput="calculate()">
            </div>
            <div class="form-group">
                <label>نسبة السعي والضريبة (%)</label>
                <input type="number" id="tax" value="7.5" oninput="calculate()">
            </div>
            <div class="form-group">
                <label>سنوات الاستثمار</label>
                <input type="number" id="years" value="10" oninput="calculate()">
            </div>
        </div>

        <div class="result-box">
            <h2 style="border:none; padding:0;">ملخص الجدوى</h2>
            <canvas id="yieldChart"></canvas>
            
            <div class="stat-grid">
                <div class="stat-card">
                    <label>العائد السنوي</label>
                    <span class="stat-val" id="yieldPerc">5%</span>
                </div>
                <div class="stat-card">
                    <label>صافي الربح المتوقع</label>
                    <span class="stat-val" id="totalProfit">500,000</span>
                </div>
            </div>
            
            <div id="decision" style="margin-top: 30px; padding: 15px 40px; border-radius: 50px; font-weight: bold;">
                جاري التحليل...
            </div>
        </div>

        <footer>جميع الحقوق محفوظة لعائلة العز &copy; 2026</footer>
    </div>

    <script>
        let myChart;

        function calculate() {
            const price = parseFloat(document.getElementById('price').value) || 0;
            const rent = parseFloat(document.getElementById('rent').value) || 0;
            const tax = parseFloat(document.getElementById('tax').value) || 0;
            const years = parseFloat(document.getElementById('years').value) || 0;

            const initialCost = price + (price * (tax / 100));
            const totalRent = rent * years;
            const yieldPerc = (rent / initialCost) * 100;
            
            document.getElementById('yieldPerc').innerText = yieldPerc.toFixed(2) + "%";
            document.getElementById('totalProfit').innerText = totalRent.toLocaleString() + " ر.س";

            const decision = document.getElementById('decision');
            if(yieldPerc >= 7) {
                decision.innerText = "فرصة ذهبية ✅";
                decision.style.backgroundColor = "#2ecc71";
                decision.style.color = "white";
            } else if(yieldPerc >= 4) {
                decision.innerText = "استثمار آمن ⚠️";
                decision.style.backgroundColor = var(--gold);
                decision.style.color = "black";
            } else {
                decision.innerText = "عائد منخفض ❌";
                decision.style.backgroundColor = "#e74c3c";
                decision.style.color = "white";
            }

            updateChart(initialCost, totalRent);
        }

        function updateChart(cost, profit) {
            const ctx = document.getElementById('yieldChart').getContext('2d');
            if (myChart) myChart.destroy();
            
            myChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['التكلفة', 'الأرباح'],
                    datasets: [{
                        data: [cost, profit],
                        backgroundColor: ['#222', '#c5a059'],
                        borderColor: '#000',
                        borderWidth: 5
                    }]
                },
                options: { plugins: { legend: { display: false } } }
            });
        }

        calculate();
    </script>
</body>
</html>
