<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تعرف على الطير الغلياني | حديقة الريان</title>
    <style>
        :root {
            --gold: #c5a059;
            --dark-bg: #0a0a0a;
            --card-bg: #141414;
            --text-gray: #a0a0a0;
        }

        body {
            background-color: var(--dark-bg);
            color: white;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .bird-profile {
            width: 90%;
            max-width: 450px;
            background: var(--card-bg);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            border: 1px solid #222;
        }

        .bird-image {
            width: 100%;
            height: 400px;
            object-fit: cover;
            border-bottom: 3px solid var(--gold);
        }

        .content {
            padding: 30px;
        }

        .bird-name {
            font-size: 1.8rem;
            color: var(--gold);
            margin: 0 0 10px 0;
            font-weight: 300;
            letter-spacing: 1px;
        }

        .origin {
            font-size: 0.9rem;
            color: var(--text-gray);
            margin-bottom: 20px;
            display: block;
        }

        .details-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            text-align: right;
            border-top: 1px solid #222;
            padding-top: 20px;
        }

        .detail-item h4 {
            color: var(--gold);
            margin: 0 0 5px 0;
            font-size: 0.85rem;
            text-transform: uppercase;
        }

        .detail-item p {
            margin: 0;
            font-size: 0.95rem;
            color: #eee;
        }

        .description {
            margin-top: 25px;
            font-size: 0.9rem;
            line-height: 1.6;
            color: #ccc;
        }

        footer {
            text-align: center;
            padding: 20px;
            font-size: 0.7rem;
            color: #444;
        }
    </style>
</head>
<body>

    <div class="bird-profile">
        <img src="http://googleusercontent.com/image_collection/image_retrieval/13672276497791823590_0" alt="الطير الغلياني" class="bird-image">
        
        <div class="content">
            <span class="origin">فصيلة نادرة | موطنه الأصلي: آسيا</span>
            <h1 class="bird-name">الطير الغلياني</h1>
            
            <div class="details-grid">
                <div class="detail-item">
                    <h4>الغذاء المفضل</h4>
                    <p>البذور والفواكه</p>
                </div>
                <div class="detail-item">
                    <h4>متوسط العمر</h4>
                    <p>15 - 20 سنة</p>
                </div>
                <div class="detail-item">
                    <h4>الطبع</h4>
                    <p
